<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fbeaf6">
<title>כוכבת הקלידים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261114i">
</head>
<body>
<div id="app">

  <section id="scr-home" class="scr on">
    <header class="hello">
      <div class="mascot" aria-hidden="true">🎹</div>
      <div class="grow"><h1 id="hiTitle">היי!</h1><div class="sub">מה ננגן היום?</div></div>
      <button class="icon" id="fsBtn" title="מסך מלא">⛶</button>
    </header>
    <div class="rotate"><i>🔄</i>כדאי לסובב את המכשיר לרוחב — רואים הרבה יותר טוב</div>
    <div class="scroll homegrid">
      <aside class="side">
      <div class="statrow">
        <div class="stat lvlbox"><div class="r"><b id="stLvl">רמה 1</b><small id="stNext"></small></div><div class="xpbar"><i id="xpFill"></i></div></div>
        <div class="stat"><span>⭐</span><b id="stStars">0</b><small>כוכבים</small></div>
        <div class="stat"><span>🔥</span><b id="stStreak">0</b><small>ימים ברצף</small></div>
      </div>
      <div id="daily"></div>
      </aside>
      <main class="main">
      <div class="search"><input id="askInput" type="search" placeholder="🔍 חיפוש שיר" autocomplete="off" enterkeyhint="search"></div>
      <div id="catChips" class="chips scrollx"></div>
      <div id="songList"></div>
      </main>
    </div>
  </section>

  <section id="scr-song" class="scr">
    <header class="top"><button class="icon" data-go="home" title="חזרה">→</button><div class="grow"></div><div id="sgStars" class="stats"></div></header>
    <div class="scroll pad songgrid">
      <div class="songside">
      <div class="songhero" id="sgHero"><div class="cover big" id="sgCover"></div><div class="grow"><h1 id="sgTitle"></h1><div class="sub" id="sgComposer"></div></div></div>
      </div>
      <div class="songmain">
      <h3>איך מתרגלים?</h3>
      <div class="modes">
        <button class="mode" data-mode="listen"><i>👂</i><b>להקשיב</b><span>שומעים ורואים את השיר</span></button>
        <button class="mode" data-mode="wait"><i>🐢</i><b>ללמוד</b><span>השיר מחכה לך בכל תו</span></button>
        <button class="mode" data-mode="echo"><i>🦜</i><b>תופסת מנגינה</b><span>שומעים קטע — ומנגנים אותו בחזרה מהזיכרון</span></button>
        <button class="mode hot" data-mode="smart"><i>🎯</i><b>אימון חכם</b><span>חלק אחרי חלק, מלאט למהיר</span></button>
        <button class="mode" data-mode="play"><i>🎮</i><b>משחק</b><span>בקצב, עם ניקוד וכוכבים</span></button>
      </div>
      </div>
      <div class="opts">
      <h3>מה מנגנים?</h3>
      <div id="sgArr" class="chips"></div>
      <h3>מהירות</h3>
      <div id="sgSpeed" class="chips speed">
        <button class="chip" data-tempo="0.5">🐌 לאט מאוד</button><button class="chip" data-tempo="0.7">🐢 לאט</button><button class="chip" data-tempo="0.85">🚶 בינוני</button><button class="chip" data-tempo="1">🐇 רגיל</button>
      </div>
      <button id="sgDelete" class="link danger" hidden>מחיקת השיר</button>
      </div>
    </div>
  </section>

  <section id="scr-game" class="scr">
    <div class="hud">
      <button class="icon" id="gExit">✕</button>
      <button class="icon" id="gPause">⏸</button>
      <button class="icon" id="gSkip" title="דילוג">⏭</button>
      <button class="icon" id="gSlow">🐢</button>
      <span id="gTempo" class="pill">100%</span>
      <button class="icon" id="gFast">🐇</button>
      <span id="hudChord" class="pill chord"></span>
      <span class="grow"></span>
      <span id="hudBanner" class="pill"></span>
      <span id="hudCombo"></span>
      <span class="pill score">⭐ <b id="hudScore">0</b></span>
      <span id="gSrc" class="pill"></span>
    </div>
    <div class="prog"><i id="hudProg"></i></div>
    <div class="stage">
      <canvas id="gameCv"></canvas>
      <div id="hudLyric"></div>
      <div id="hudMsg"></div>
      <div class="rotate game"><i>🔄</i>סובבי לרוחב כדי לראות יותר קלידים</div>
    </div>
  </section>

  <section id="scr-result" class="scr">
    <div class="scroll pad center">
      <div class="rshead">
      <div id="rsStars" class="bigstars"></div>
      <h1 id="rsTitle"></h1>
      <div id="rsAcc" class="acc"></div>
      </div>
      <div class="rsbody">
      <div id="rsGrid" class="rgrid"></div>
      <div id="rsTip" class="tip"></div>
      <div class="btns">
        <button id="rsWeak" class="btn hot" hidden></button>
        <button id="rsAgain" class="btn">🔁 שוב</button>
        <button id="rsBack" class="btn ghost">חזרה לשיר</button>
      </div>
      </div>
    </div>
  </section>

  <section id="scr-chords" class="scr">
    <header class="top"><div class="brand">🎼 אקורדים</div><div class="stats"><span id="chInfo"></span></div></header>
    <div class="scroll pad chgrid">
      <div class="chmain">
      <div class="chcard">
        <div id="chName">C</div>
        <div id="chHeb"></div>
        <div id="chNotes"></div>
        <div class="btns row">
          <button id="chPlay" class="btn ghost">🔊 השמיעי</button>
          <button id="chInv" class="btn ghost">🔄 היפוך</button>
        </div>
      </div>
      <canvas id="chCv"></canvas>
      <button id="chGame" class="btn hot wide"></button>
      </div>
      <div class="chlist">
      <div class="sub">בחרי אקורד ללמוד, או סמני אילו שלבים ייכנסו לאתגר:</div>
      <div id="chGrid"></div>
      </div>
    </div>
  </section>

  <section id="scr-settings" class="scr">
    <header class="top"><div class="brand">⚙️ הגדרות</div></header>
    <div class="scroll pad" id="setBody"></div>
  </section>

  <section id="scr-samples" class="scr">
    <header class="top"><button class="icon" data-go="settings">→</button><div class="brand">🎙️ הקלטות לכיוונון</div></header>
    <div class="scroll pad" id="smBody"></div>
  </section>

  <nav id="nav">
    <button data-go="home" class="on"><i>🎵</i><span>שירים</span></button>
    <button data-go="chords"><i>🎼</i><span>אקורדים</span></button>
    <button data-go="settings"><i>⚙️</i><span>הגדרות</span></button>
  </nav>
  <div id="toast"></div>
  <input type="file" id="packFile" hidden>
  <input type="file" id="midiFile" accept=".mid,.midi,.kar,audio/midi" multiple hidden>
</div>

<script src="js/store.js?v=20261114i"></script>
<script src="js/music.js?v=20261114i"></script>
<script src="js/songs.js?v=20261114i"></script>
<script src="js/audio.js?v=20261114i"></script>
<script src="js/detector.js?v=20261114i"></script>
<script src="js/input.js?v=20261114i"></script>
<script src="js/keyboard.js?v=20261114i"></script>
<script src="js/game.js?v=20261114i"></script>
<script src="js/chords.js?v=20261114i"></script>
<script src="js/samples.js?v=20261114i"></script>
<script src="js/midifile.js?v=20261114i"></script>
<script src="js/websongs.js?v=20261114i"></script>
<script src="js/library.js?v=20261114i"></script>
<script src="js/app.js?v=20261114i"></script>
</body>
</html>
